<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Foto Saya</title>
    <link rel="stylesheet" href="gaya.css">
</head>
<body>
    <header>
        <h1>📸 Koleksi Kenangan Saya</h1>
        <p>Kumpulan foto-foto indah yang pernah saya abadikan</p>
    </header>

    <!-- Galeri Foto -->
    <div class="galeri">
        <div class="item-foto">
            <img src="gambar/foto1.jpg" alt="Foto 1">
        </div>
        <div class="item-foto">
            <img src="gambar/foto2.jpg" alt="Foto 2">
        </div>
        <div class="item-foto">
            <img src="gambar/foto3.jpg" alt="Foto 3">
        </div>
        <!-- Tambah baris di atas sesuai jumlah foto kamu -->
    </div>

    <!-- Tampilan Gambar Besar (Lightbox) -->
    <div class="kotak-besar" id="kotakBesar">
        <span class="tutup">&times;</span>
        <img class="gambar-besar" id="gambarBesar" src="" alt="">
    </div>

    <script src="fungsi.js"></script>
</body>
</html>
